<div *ngIf="authenticated">
  <div class="button-container">
    <button class="button">
      <a [routerLink]="['/login']" routerLinkActive="active">
        <mat-icon>home</mat-icon>
      </a>
    </button>
    <button class="button">
      <a [routerLink]="['/search']" routerLinkActive="active">
        <mat-icon matTooltip="Search (ctrl+s)">search</mat-icon>
      </a>
    </button>
  
    <button class="button">
      <a [routerLink]="['/pledge']" routerLinkActive="active">
        <mat-icon matTooltip="Pledge (ctrl+o)">account_balance</mat-icon>
      </a>
    </button>

    <button class="button">
      <a [routerLink]="['/jewellery/dashboard']" routerLinkActive="active">
        <mat-icon matTooltip="Jewellery ERP">diamond</mat-icon>
      </a>

      <div class="mobile1">
        <div
          class="card w-100 bg-white p-5 shadow-md shadow-purple-200/50 rounded-md"
        >
          <ul class="w-full flex flex-col gap-2">
            <li
              class="flex-center cursor-pointer p-16- w-full whitespace-nowrap"
              (mouseenter)="openSection('dashboard')"
              (mouseleave)="closeSection('dashboard')"
            >
              <!-- Button for toggling the section -->
              <button
                (click)="toggleSection('dashboard')"
                class="p-16- flex items-center justify-between w-full gap-4 py-2 px-4 rounded-lg bg-white shadow-sm hover:bg-purple-50 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-purple-600 transition-all ease-in-out"
              >
                <mat-icon class="text-gray-500 group-hover:text-purple-600"
                  >menu</mat-icon
              >
                <span
                  class="flex-grow text-left text-gray-700 group-hover:text-purple-600"
                  >Menu</span
                >
                <mat-icon
                  class="transform transition-transform"
                  [ngClass]="{ 'rotate-180': isOpen['dashboard'] }"
                >
                  expand_more
                </mat-icon>
                <div class="rates">
                  <div class="stats shadow">
                    <div class="stat-container">
                      <div class="stat">
                        <div class="stat-title">Gold Rate</div>
                        <div class="stat-value">{{gold_rate}}</div>
                      </div>
                      <div class="stat">
                        <div class="stat-title">Silver Rate</div>
                        <div class="stat-value">{{silver_rate}}</div>
                      </div>
                    </div>
                  </div>
                </div>
              </button>
  
              <!-- Section content -->
              <div
                *ngIf="isOpen['dashboard']"
                [@slideToggle]
                class="section-content bg-purple-50 p-4 rounded-lg shadow-inner mt-2"
              >
                <!-- Replace this with your actual dashboard content -->
                <li
                  class="flex-center cursor-pointer p-16- w-full whitespace-nowrap"
                  (click)="home()"
                >
                  <button
                    class="p-16- flex size-full gap-4 p-4 group font- rounded-full bg-cover hover:bg-purple-100 hover:shadow-inner focus:bg-gradient-to-r from-purple-400 to-purple-600 focus:text-white text-gray-700 transition-all ease-linear"
                  >
                    <mat-icon>home</mat-icon>
                    Home
                  </button>
                </li>
  
                <li
                  class="flex-center cursor-pointer p-16- w-full whitespace-nowrap"
                  (click)="pledge()"
                >
                  <button
                    class="p-16- flex size-full gap-4 p-4 group font- rounded-full bg-cover hover:bg-purple-100 hover:shadow-inner focus:bg-gradient-to-r from-purple-400 to-purple-600 focus:text-white text-gray-700 transition-all ease-linear"
                  >
                    <mat-icon>account_balance</mat-icon>
                    Pledge
                  </button>
                </li>

                <li
                  class="flex-center cursor-pointer p-16- w-full whitespace-nowrap"
                  [routerLink]="['/jewellery/dashboard']"
                >
                  <button
                    class="p-16- flex size-full gap-4 p-4 group font- rounded-full bg-cover hover:bg-amber-100 hover:shadow-inner focus:bg-gradient-to-r from-amber-400 to-yellow-600 focus:text-white text-amber-800 transition-all ease-linear"
                  >
                    <mat-icon class="text-amber-500">diamond</mat-icon>
                    Jewellery ERP
                  </button>
                </li>
  
                <li
                  class="flex-center cursor-pointer p-16- w-full whitespace-nowrap"
                  (click)="redeem()"
                >
                  <button
                    class="p-16- flex size-full gap-4 p-4 group font- rounded-full bg-cover hover:bg-purple-100 hover:shadow-inner focus:bg-gradient-to-r from-purple-400 to-purple-600 focus:text-white text-gray-700 transition-all ease-linear"
                  >
                    <mat-icon>Redeem</mat-icon> Redeem
                  </button>
                </li>
  
                <li
                (click)="search()"
                  class="flex-center cursor-pointer p-16- w-full whitespace-nowrap"
                >
                  <button
                    class="p-16- flex size-full gap-4 p-4 group font- rounded-full bg-cover hover:bg-purple-100 hover:shadow-inner focus:bg-gradient-to-r from-purple-400 to-purple-600 focus:text-white text-gray-700 transition-all ease-linear"
                  >
                    <mat-icon>search</mat-icon> Search
                  </button>
                </li>
  
                <li
                (click)="settings()"
                  class="flex-center cursor-pointer p-16- w-full whitespace-nowrap"
                >
                  <button
                    class="p-16- flex size-full gap-4 p-4 group font- rounded-full bg-cover hover:bg-purple-100 hover:shadow-inner focus:bg-gradient-to-r from-purple-400 to-purple-600 focus:text-white text-gray-700 transition-all ease-linear"
                  >
                    <mat-icon>settings</mat-icon>
                    Settings
                  </button>
