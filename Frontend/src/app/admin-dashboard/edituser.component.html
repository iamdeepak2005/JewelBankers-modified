<h1 mat-dialog-title>Edit User</h1>
<div mat-dialog-content>
  <form [formGroup]="editUserForm">
    <mat-form-field>
      <mat-label>Username</mat-label>
      <input matInput formControlName="username">
    </mat-form-field>
    
    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput formControlName="email">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password">
    </mat-form-field>
    <mat-form-field>
      <mat-label>User Data Base Name</mat-label>
      <input matInput type="text" formControlName="userDatabaseName">
    </mat-form-field>

    

    
    

    <div>
      <div *ngFor="let role of roles">
        <mat-checkbox 
          [checked]="checkboxValues.includes(role)"
          (change)="updateCheckbox(role, $event)"
          >
          {{role}}
        </mat-checkbox>
      </div>
    </div>
    <!-- <div>
      <mat-checkbox  (change)="updateStatus()" formControlName="status">Paid</mat-checkbox>
    </div> -->

    <div>
      <mat-checkbox (change)="updateStatus($event)" formControlName="status">Paid</mat-checkbox>
    </div>
    <div>
      <mat-checkbox (change)="onWhatsappChange($event)" formControlName="whatsapp">Whatsapp</mat-checkbox>
    </div>
    
  </form>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Cancel</button>
  <button mat-button (click)="onSubmit()">Save</button>
</div>
