





<div class="container">
    <div class="slide" #slide>
      
        
        <div class="mainActive">
            <div class="active" style="background-image: url({{items[activeIndex].image}});">
                <div class="content">
                    <div  class="name">{{items[activeIndex].name}}</div>
                    <div   class="des">{{items[activeIndex].description}}</div>
                    <button class="globalButton">See More</button>
                </div>
            </div>
        </div>

        <!-- <div class="item" style="background-image: url(https://i.ibb.co/NSwVv8D/img3.jpg);">

                <button>See More</button>
            </div>
        </div> -->
        @for (i of items; track $index) {
            
            <div class="item" style="background-image: url({{i.image}});">
            </div>
            
        }

    </div>
